    <!-- Заголовок партнерів -->
    <script>
        function generate_title_parners() {
            let block_brands = document.querySelector('.brands') || document.querySelector('.frontBrands');
            if (!block_brands) return;

            let text = document.createElement('h2');
            let lang = document.documentElement.lang;
            text.classList.add('title_block_partners-nb');

            text.style.textAlign = 'center';
            text.style.background = '#1b4281';
            text.style.width = 'max-content';
            text.style.margin = 'auto';
            text.style.padding = '10px';
            text.style.color = '#fff';
            text.style.textTransform = 'uppercase';
            text.style.borderRadius = '50px';
            text.style.fontSize = window.innerWidth < 900 ? '13px' : '24px';

            text.innerText = lang === 'uk'
                ? 'Зустрічай нас в магазинах партнерів'
                : 'Meet us in our partner stores';

            block_brands.insertBefore(text, block_brands.firstChild);
        }

        generate_title_parners();
    </script>


    <!-- Автоматичний alt до img-->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Банери
            document.querySelectorAll('.banner-img').forEach((img, i) => {
                const altTexts = [
                    'BUCO Coffee — кава власного обсмаження',
                    'BUCO Coffee — кава для дому та бізнесу',
                    'BUCO Coffee — зернова та specialty кава'
                ];

                if (!img.alt) img.alt = altTexts[i] || 'BUCO Coffee';
            });

            // Партнери
            document.querySelectorAll('.frontBrands-img').forEach(img => {
                if (!img.alt) {
                    img.alt = 'Партнер BUCO Coffee';
                }
            });

            // Cloudinary картинки
            document.querySelectorAll('img[src*="cloudinary"]').forEach(img => {
                if (!img.alt) {
                    img.alt = 'BUCO Coffee';
                }
            });

        });
    </script>

    <!-- Доступні імена для кнопок -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            document.querySelectorAll('.search__button')
                .forEach(el => el.setAttribute('aria-label', 'Пошук'));

            document.querySelectorAll('.counter-btn.__plus')
                .forEach(el => el.setAttribute('aria-label', 'Збільшити кількість'));

            document.querySelectorAll('.counter-btn.__minus')
                .forEach(el => el.setAttribute('aria-label', 'Зменшити кількість'));

        });
    </script>

    <!-- Мітки для елементів форми -->
    <script>

                .forEach(el => {
                    el.setAttribute('aria-label', 'Кількість товару');

    <!-- Зрозуміла назва для посилань -->
    <script>

    <!-- Input, slideCarousel, nav-btn, identical links -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            document.querySelectorAll('.sp-form-control')
                .forEach(el => {
                    el.setAttribute('aria-label', 'Email для підписки');
                });

            document.querySelectorAll('.slideCarousel-nav-btn.__slideLeft')
                .forEach(el => {
                    el.setAttribute('aria-label', 'Попередній слайд');
                });

            document.querySelectorAll('.slideCarousel-nav-btn.__slideRight')
                .forEach(el => {
                    el.setAttribute('aria-label', 'Наступний слайд');
                });

            document.querySelectorAll('.banner-a')
                .forEach((el, index) => {
                    el.setAttribute(
                        'aria-label',
                        'Банер пропозиції ' + (index + 1)
                    );
                });

        });
    </script>

    <!-- Виправляє "кривий" aria-activedescendant  плагіну маски телефону -->

    <script>
